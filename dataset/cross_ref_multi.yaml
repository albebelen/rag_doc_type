- id: ts7_short_01
  test_set: 7
  answer_type: short
  difficulty: easy
  question: >
    Which part of an operating system is always running and always resident in memory, which hardware unit raises a page fault, and what does the kernel article call the scheme of bringing data into RAM only when a program needs it?
  answer: >
    The kernel is the part of the operating system that is always running and always resident in memory. A page fault is raised by the memory management unit (MMU), and the kernel article calls the scheme of loading data into RAM when a program needs it demand paging.
  ground_truth: >
    The kernel is the part of the operating system that is always running and always resident in memory. A page fault is raised by the memory management unit (MMU), and the kernel article calls the scheme of loading data into RAM when a program needs it demand paging.
