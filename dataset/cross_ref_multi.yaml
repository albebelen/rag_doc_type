- id: ts7_short_04
  test_set: 7
  answer_type: short
  difficulty: easy
  question: >
    What does the operating system article call the violation that occurs when a program accesses an address it is not allowed to, which area of memory does the kernel article say applications are not permitted by the processor to address, and which address does the page fault article say a null pointer is usually represented as pointing to?
  answer: >
    The operating system article calls it a segmentation violation, or Seg-V. The kernel article says the processor does not permit applications to address kernel memory (kernel space), and the page fault article says a null pointer is usually represented as a pointer to address 0 in the address space.
  ground_truth: >
    The operating system article calls it a segmentation violation, or Seg-V. The kernel article says the processor does not permit applications to address kernel memory (kernel space), and the page fault article says a null pointer is usually represented as a pointer to address 0 in the address space.
