- id: ts7_short_03
  test_set: 7
  answer_type: short
  difficulty: easy
  question: >
    The operating system article says Linux is designed like other UNIX systems that do not use which kind of kernel, what lets the Linux kernel insert and remove code at runtime according to the kernel article, and which signal do UNIX-like systems typically use to report an invalid page fault?
  answer: >
    Linux is designed like other UNIX systems that do not use a microkernel. The Linux kernel is both monolithic and modular because it can insert and remove loadable kernel modules at runtime, and UNIX-like systems typically report invalid page faults with signals such as SIGSEGV.
  ground_truth: >
    Linux is designed like other UNIX systems that do not use a microkernel. The Linux kernel is both monolithic and modular because it can insert and remove loadable kernel modules at runtime, and UNIX-like systems typically report invalid page faults with signals such as SIGSEGV.
