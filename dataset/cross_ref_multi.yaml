- id: ts7_medium_02
  test_set: 7
  answer_type: medium
  difficulty: medium
  question: >
    How is an illegal memory access detected and handled by the hardware and the kernel, and how is the error reported to the program on Windows and on UNIX-like systems?
  answer: >
    The kernel article says the processor monitors execution and stops a program that violates a rule, such as a user process trying to write to kernel memory. The operating system article says the attempt triggers an interrupt that puts the CPU back into supervisor mode with the kernel in charge, which is a segmentation violation, and the kernel generally terminates the offending program and reports the error. The page fault article adds that the page fault handler generally passes a segmentation fault to the offending process. Windows reports it as an access violation exception using structured exception handling, while UNIX-like systems typically use signals such as SIGSEGV, and if the program does not handle the error the default action is usually to terminate the process, possibly with a core dump.
  ground_truth: >
    The kernel article says the processor monitors execution and stops a program that violates a rule, such as a user process trying to write to kernel memory. The operating system article says the attempt triggers an interrupt that puts the CPU back into supervisor mode with the kernel in charge, which is a segmentation violation, and the kernel generally terminates the offending program and reports the error. The page fault article adds that the page fault handler generally passes a segmentation fault to the offending process. Windows reports it as an access violation exception using structured exception handling, while UNIX-like systems typically use signals such as SIGSEGV, and if the program does not handle the error the default action is usually to terminate the process, possibly with a core dump.
