- id: ts7_medium_01
  test_set: 7
  answer_type: medium
  difficulty: medium
  question: >
    What happens when a program accesses a page that is not currently in physical memory, and why is this more costly than a fault where the page is already in memory but not marked in the MMU?
  answer: >
    When a program needs data that is not in RAM, the kernel is interrupted, typically by a page fault. The operating system article says the kernel generally adjusts the program's virtual memory range to grant access, and the kernel article says it writes the contents of an inactive memory block to disk if necessary, replaces it with the requested data and resumes the program, a scheme known as demand paging. The page fault article calls this a major (hard) fault, where the OS must choose a free page or one used by another process, write that page out to mass storage if it was modified, mark it as not in memory in its page table, read the new page in and add an MMU entry. A minor (soft) fault is cheaper because the page is already in memory and the handler only has to point the MMU entry at it without reading from disk, whereas a major fault adds storage access latency to the program's execution.
  ground_truth: >
    When a program needs data that is not in RAM, the kernel is interrupted, typically by a page fault. The operating system article says the kernel generally adjusts the program's virtual memory range to grant access, and the kernel article says it writes the contents of an inactive memory block to disk if necessary, replaces it with the requested data and resumes the program, a scheme known as demand paging. The page fault article calls this a major (hard) fault, where the OS must choose a free page or one used by another process, write that page out to mass storage if it was modified, mark it as not in memory in its page table, read the new page in and add an MMU entry. A minor (soft) fault is cheaper because the page is already in memory and the handler only has to point the MMU entry at it without reading from disk, whereas a major fault adds storage access latency to the program's execution.
