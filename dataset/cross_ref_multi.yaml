- id: ts7_long_01
  test_set: 7
  answer_type: long
  difficulty: hard
  question: >
    Explain how virtual memory lets programs use more memory than is physically installed, what the kernel and the MMU do when a needed page is missing, how costly this is on hard disk drives and solid-state drives, and what can be done to reduce page faults.
  answer: >
    The operating system article says virtual memory gives programs the perception of much more RAM than the computer really has, because less frequently used memory can be temporarily stored on disk and swapped back on demand. The kernel article explains that virtual addressing, usually done with paging or segmentation, adds a layer of indirection that lets the OS keep data on a hard drive instead of RAM. When a program needs data that is not in RAM, the CPU signals the kernel, which writes an inactive memory block to disk if necessary, replaces it with the requested data and resumes the program, a scheme known as demand paging. The page fault article says the MMU raises the page fault and the kernel handles it by making the page accessible in physical memory or denying an illegal access. This is costly because permanent storage takes several orders of magnitude longer to access than RAM. For a typical hard disk drive with a 3 ms rotational latency, a 5 ms seek time and 0.05 ms per page transfer, paging takes about 8 ms, so with a 0.2 microsecond memory access a page fault makes the operation take about 40,000 times as long. With a fast solid-state drive with a 30 microsecond page read latency and a 70 nanosecond memory access, a hard page fault still takes over 400 times as long, and page faults can also cause thrashing. To reduce them, developers and OS designers can reduce overall memory usage or improve memory locality, use a page replacement algorithm that maximizes page hits, and add more physical memory, which lets memory-mapped file chunks stay in memory longer and lessens the need for frequent swapping.
  ground_truth: >
    The operating system article says virtual memory gives programs the perception of much more RAM than the computer really has, because less frequently used memory can be temporarily stored on disk and swapped back on demand. The kernel article explains that virtual addressing, usually done with paging or segmentation, adds a layer of indirection that lets the OS keep data on a hard drive instead of RAM. When a program needs data that is not in RAM, the CPU signals the kernel, which writes an inactive memory block to disk if necessary, replaces it with the requested data and resumes the program, a scheme known as demand paging. The page fault article says the MMU raises the page fault and the kernel handles it by making the page accessible in physical memory or denying an illegal access. This is costly because permanent storage takes several orders of magnitude longer to access than RAM. For a typical hard disk drive with a 3 ms rotational latency, a 5 ms seek time and 0.05 ms per page transfer, paging takes about 8 ms, so with a 0.2 microsecond memory access a page fault makes the operation take about 40,000 times as long. With a fast solid-state drive with a 30 microsecond page read latency and a 70 nanosecond memory access, a hard page fault still takes over 400 times as long, and page faults can also cause thrashing. To reduce them, developers and OS designers can reduce overall memory usage or improve memory locality, use a page replacement algorithm that maximizes page hits, and add more physical memory, which lets memory-mapped file chunks stay in memory longer and lessens the need for frequent swapping.
