- id: ts7_short_02
  test_set: 7
  answer_type: short
  difficulty: easy
  question: >
    What kind of kernel do most versions of Microsoft Windows use, what does Windows support to speed up I/O for many applications, and how does Windows report invalid page faults?
  answer: >
    Most versions of Microsoft Windows use a hybrid kernel. Windows supports demand paging of virtual memory, which speeds up I/O for many applications, and it uses structured exception handling to report invalid page faults as access violation exceptions.
  ground_truth: >
    Most versions of Microsoft Windows use a hybrid kernel. Windows supports demand paging of virtual memory, which speeds up I/O for many applications, and it uses structured exception handling to report invalid page faults as access violation exceptions.
