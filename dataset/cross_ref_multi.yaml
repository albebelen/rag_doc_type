- id: ts7_long_03
  test_set: 7
  answer_type: long
  difficulty: hard
  question: >
    How does a page fault fit into the interrupt mechanism described for operating systems, and how does the kernel's handling of it compare with system calls and signals?
  answer: >
    The operating system article says an interrupt, also known as an abort, exception, fault, signal or trap, changes the CPU's control flow from the running program to an interrupt handler, and that the architecture and OS must transfer control to the handler, save the state of the running process and restore it afterwards. It lists accessing an invalid memory address among the most common software interrupt error conditions, and says that when a program accesses memory that is allocated to it but not accessible, the kernel is interrupted, typically by a page fault, and generally adjusts the program's virtual memory range to grant access. The page fault article describes the page fault as an exception raised by the MMU when a process accesses a page without proper preparations, with the kernel handling it by making the page accessible in physical memory or denying an illegal access. If the address is not part of the virtual address space, the fault is invalid and a segmentation fault is passed to the offending process, which on UNIX-like systems is reported as a signal such as SIGSEGV. The kernel article says the kernel performs tasks such as handling interrupts in its protected kernel space. In contrast to a page fault, which is raised by the MMU when a process accesses memory without proper preparations, a system call is how a process explicitly requests a service from the kernel that it does not normally have permission to run, and one of the ways to invoke it, which is available on most hardware and therefore very common, is to use an interrupt. The other methods are call gates, special system call instructions and a memory-based queue.
  ground_truth: >
    The operating system article says an interrupt, also known as an abort, exception, fault, signal or trap, changes the CPU's control flow from the running program to an interrupt handler, and that the architecture and OS must transfer control to the handler, save the state of the running process and restore it afterwards. It lists accessing an invalid memory address among the most common software interrupt error conditions, and says that when a program accesses memory that is allocated to it but not accessible, the kernel is interrupted, typically by a page fault, and generally adjusts the program's virtual memory range to grant access. The page fault article describes the page fault as an exception raised by the MMU when a process accesses a page without proper preparations, with the kernel handling it by making the page accessible in physical memory or denying an illegal access. If the address is not part of the virtual address space, the fault is invalid and a segmentation fault is passed to the offending process, which on UNIX-like systems is reported as a signal such as SIGSEGV. The kernel article says the kernel performs tasks such as handling interrupts in its protected kernel space. In contrast to a page fault, which is raised by the MMU when a process accesses memory without proper preparations, a system call is how a process explicitly requests a service from the kernel that it does not normally have permission to run, and one of the ways to invoke it, which is available on most hardware and therefore very common, is to use an interrupt. The other methods are call gates, special system call instructions and a memory-based queue.
