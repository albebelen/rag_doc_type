- id: ts7_medium_03
  test_set: 7
  answer_type: medium
  difficulty: medium
  question: >
    How does a bug in kernel code affect a monolithic kernel compared with a microkernel, and what does the page fault article say can result from illegal memory accesses and what can cause them?
  answer: >
    The kernel article says a monolithic kernel runs everything in the same address space, so a bug in a device driver can crash the entire system, whereas with a microkernel a crashing kernel process can often be handled by restarting the service that caused the error. The operating system article agrees, noting that a monolithic kernel is still vulnerable if any part of it is compromised, while microkernels separate the kernel's privileges into many security domains and reduce the consequences of a single kernel breach. The page fault article says illegal accesses and invalid page faults can result in a segmentation fault or bus error and an app or OS crash, and that software bugs are often the cause, although hardware memory errors such as those caused by overclocking can also corrupt pointers and make valid code fail.
  ground_truth: >
    The kernel article says a monolithic kernel runs everything in the same address space, so a bug in a device driver can crash the entire system, whereas with a microkernel a crashing kernel process can often be handled by restarting the service that caused the error. The operating system article agrees, noting that a monolithic kernel is still vulnerable if any part of it is compromised, while microkernels separate the kernel's privileges into many security domains and reduce the consequences of a single kernel breach. The page fault article says illegal accesses and invalid page faults can result in a segmentation fault or bus error and an app or OS crash, and that software bugs are often the cause, although hardware memory errors such as those caused by overclocking can also corrupt pointers and make valid code fail.
