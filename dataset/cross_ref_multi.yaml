- id: ts7_long_02
  test_set: 7
  answer_type: long
  difficulty: hard
  question: >
    Compare the kernel designs of Linux, Windows and macOS, and describe what the documents say about how page faults or invalid memory accesses are handled or reported on them.
  answer: >
    For Linux, the operating system article says its design is similar to other UNIX systems that do not use a microkernel, and that Linux distributions are made of a kernel, system libraries and system utilities. The kernel article describes the Linux kernel as both monolithic and modular because it can load and remove kernel modules at runtime. The page fault article says UNIX-like systems typically report invalid page faults with signals such as SIGSEGV, and if the program does not handle the error the OS usually terminates the process and notifies the user, possibly producing a core dump. For Windows, the operating system article describes a proprietary system whose Windows Executive uses kernel-mode objects for processes, threads and sections, with support for demand paging of virtual memory and preemptive multitasking. The kernel article says most versions of Windows, from NT 3.1 to Windows 11, use a hybrid kernel. The page fault article says Windows uses structured exception handling to report invalid page faults as access violation exceptions, that it often reports crashes without details, and that an experienced user can retrieve more with WinDbg and the minidump. For macOS, the kernel article says it uses a hybrid kernel called XNU, based on code from OSF/1's Mach kernel and FreeBSD's monolithic kernel, and the page fault article names macOS together with Windows as an operating system using virtual memory where valid page faults are common and necessary.
  ground_truth: >
    For Linux, the operating system article says its design is similar to other UNIX systems that do not use a microkernel, and that Linux distributions are made of a kernel, system libraries and system utilities. The kernel article describes the Linux kernel as both monolithic and modular because it can load and remove kernel modules at runtime. The page fault article says UNIX-like systems typically report invalid page faults with signals such as SIGSEGV, and if the program does not handle the error the OS usually terminates the process and notifies the user, possibly producing a core dump. For Windows, the operating system article describes a proprietary system whose Windows Executive uses kernel-mode objects for processes, threads and sections, with support for demand paging of virtual memory and preemptive multitasking. The kernel article says most versions of Windows, from NT 3.1 to Windows 11, use a hybrid kernel. The page fault article says Windows uses structured exception handling to report invalid page faults as access violation exceptions, that it often reports crashes without details, and that an experienced user can retrieve more with WinDbg and the minidump. For macOS, the kernel article says it uses a hybrid kernel called XNU, based on code from OSF/1's Mach kernel and FreeBSD's monolithic kernel, and the page fault article names macOS together with Windows as an operating system using virtual memory where valid page faults are common and necessary.
