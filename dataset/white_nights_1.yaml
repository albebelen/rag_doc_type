- id: ts9_long_03
  test_set: 9
  answer_type: long
  difficulty: hard
  question: >
    What role do letters play in the story, from the first letter Nastenka writes to the letter she sends the narrator at the end?
  answer: >
    In the Second Night, when Nastenka cannot go to the lodger herself, the narrator suggests that she write to him and sketches what the letter might say, and Nastenka turns out to have a letter already written and sealed, which she hands to him to deliver to some good simple people who will pass it on to the lodger, the two of them playfully spelling out and humming the name Rosina. This fits the arrangement she made with the lodger, that on arriving he would either leave her a letter or be at the meeting place at ten o'clock. On the Third Night the narrator says he will go for any answer as soon as it is light and notes that no letter has come. On the Fourth Night Nastenka asks eagerly whether he has brought the letter, and when he says there is none she is devastated, wondering whether something in her own letter caused the silence and complaining that she has not had a single line in three days. In the Morning Matrona brings the narrator a letter from Nastenka herself, in which she asks his forgiveness, says it was a dream and a mirage, announces that she is to be married to the lodger the following week, and hopes the narrator will stay her friend and brother.
  ground_truth: >
