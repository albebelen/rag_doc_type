- id: ts9_long_02
  test_set: 9
  answer_type: long
  difficulty: hard
  question: >
    How do the narrator's feelings and his relationship with Nastenka develop over the four nights and the morning that follows?
  answer: >
    On the First Night the narrator, a lonely dreamer who has lived almost eight years in Petersburg with hardly an acquaintance, is despondent because the city has emptied for the summer, cheers up after a walk in the country, and ends the night happy after rescuing a crying girl from a drunken gentleman and agreeing to meet her again the next day. On the Second Night he describes himself as a dreamer who lives alone, tells her that he has lost his best years and has lived only for two evenings, and listens to Nastenka's history of the lodger who promised to return after a year, then suggests that she write to him. On the Third Night, a gloomy rainy day, he realizes that her tenderness towards him was really joy at the thought of seeing the other man, and he feels sad when she says she likes him because he has not fallen in love with her, and he goes home depressed when the lodger does not come. On the Fourth Night he has no reply to bring, and when Nastenka is in despair he confesses that he loves her, she says she loves him too, and they make plans for him to become their lodger. When the lodger suddenly appears, Nastenka rushes to him, returns briefly to give the narrator a warm kiss, and leaves with him. In the Morning the narrator receives a letter in which Nastenka asks his forgiveness, calls it all a dream and a mirage, says she is to be married to the lodger the next week and hopes to remain his friend, and although his room and his future seem dim, he says he bears her no grudge and asks whether a whole moment of happiness is too little for a man's whole life.
  ground_truth: >
    On the First Night the narrator, a lonely dreamer who has lived almost eight years in Petersburg with hardly an acquaintance, is despondent because the city has emptied for the summer, cheers up after a walk in the country, and ends the night happy after rescuing a crying girl from a drunken gentleman and agreeing to meet her again the next day. On the Second Night he describes himself as a dreamer who lives alone, tells her that he has lost his best years and has lived only for two evenings, and listens to Nastenka's history of the lodger who promised to return after a year, then suggests that she write to him. On the Third Night, a gloomy rainy day, he realizes that her tenderness towards him was really joy at the thought of seeing the other man, and he feels sad when she says she likes him because he has not fallen in love with her, and he goes home depressed when the lodger does not come. On the Fourth Night he has no reply to bring, and when Nastenka is in despair he confesses that he loves her, she says she loves him too, and they make plans for him to become their lodger. When the lodger suddenly appears, Nastenka rushes to him, returns briefly to give the narrator a warm kiss, and leaves with him. In the Morning the narrator receives a letter in which Nastenka asks his forgiveness, calls it all a dream and a mirage, says she is to be married to the lodger the next week and hopes to remain his friend, and although his room and his future seem dim, he says he bears her no grudge and asks whether a whole moment of happiness is too little for a man's whole life.
