- id: ts9_medium_02
  test_set: 9
  answer_type: medium
  difficulty: medium
  question: >
    How does Nastenka's grandmother keep her at home, and how did Nastenka once try to deceive her?
  answer: >
    Nastenka's blind grandmother pinned Nastenka's dress to her own after Nastenka got into mischief, so that the two sit together for days, the grandmother knitting a stocking while Nastenka sews or reads aloud. Once Nastenka tried to deceive her by persuading Fekla, the deaf charwoman, to sit in her place while the grandmother slept, and went off to see a friend nearby. The grandmother woke up and asked questions, Fekla could not tell what she was being asked, so she undid the pin and ran away, and Nastenka was caught and afterwards was not allowed to stir.
