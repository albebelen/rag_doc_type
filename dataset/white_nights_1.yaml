- id: ts9_long_01
  test_set: 9
  answer_type: long
  difficulty: hard
  question: >
    Trace Nastenka's relationship with the lodger as she tells it, from his arrival in the house to the point where he returns after a year.
  answer: >
    Nastenka explains that a new lodger moved into the upper storey of the little wooden house that belongs to her blind grandmother, and that the grandmother was displeased to hear that he was young and pleasant looking. One morning, when he came to discuss papering his rooms, Nastenka forgot she was pinned to her grandmother, jumped up so that the chair moved and burst into tears from shame, and he bowed and left. He then sent her French books, first Walter Scott's novels and later Pushkin, spoke to her on the stairs, asked whether she was dull sitting all day with her grandmother and invited her to the theatre without her grandmother's knowledge, which she refused, but he then took both of them to The Barber of Seville. He took them to the theatre twice more but otherwise almost stopped visiting, and Nastenka grew restless and thin, concluding that he only pitied her. A year earlier, in May, he told her grandmother that he had to go back to Moscow for a year, so Nastenka took a bundle of her clothes to his room, wept and said she could not live without him, and he answered that he was too poor to marry now but swore that if she still loved him after a year they would be happy. A year has now passed and he has been back for three days, but he has not shown himself or sent any word, which is why Nastenka is in tears.
  ground_truth: >
    Nastenka explains that a new lodger moved into the upper storey of the little wooden house that belongs to her blind grandmother, and that the grandmother was displeased to hear that he was young and pleasant looking. One morning, when he came to discuss papering his rooms, Nastenka forgot she was pinned to her grandmother, jumped up so that the chair moved and burst into tears from shame, and he bowed and left. He then sent her French books, first Walter Scott's novels and later Pushkin, spoke to her on the stairs, asked whether she was dull sitting all day with her grandmother and invited her to the theatre without her grandmother's knowledge, which she refused, but he then took both of them to The Barber of Seville. He took them to the theatre twice more but otherwise almost stopped visiting, and Nastenka grew restless and thin, concluding that he only pitied her. A year earlier, in May, he told her grandmother that he had to go back to Moscow for a year, so Nastenka took a bundle of her clothes to his room, wept and said she could not live without him, and he answered that he was too poor to marry now but swore that if she still loved him after a year they would be happy. A year has now passed and he has been back for three days, but he has not shown himself or sent any word, which is why Nastenka is in tears.
