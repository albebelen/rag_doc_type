- id: ts9_medium_03
  test_set: 9
  answer_type: medium
  difficulty: medium
  question: >
    What promise does the lodger make to Nastenka before leaving for Moscow, and what arrangement do they make for his return?
  answer: >
    The lodger tells Nastenka that he is poor and cannot marry her now, but swears that if he is ever in a position to marry, she will make his happiness. He says he will be in Moscow for a year to establish his position and that if she still loves him when he comes back they will be happy, although he cannot bind her by any promise. They agree not to tell her grandmother, and Nastenka says that on the embankment, at ten o'clock, he promised to come to them directly on his arrival and, if she did not refuse him, to tell the grandmother everything. They also agreed that on arriving he would either leave a letter for her with some good simple people she knows or be at their meeting place at ten o'clock on the day he arrived.
  ground_truth: >
