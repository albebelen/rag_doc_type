- id: ts9_medium_01
  test_set: 9
  answer_type: medium
  difficulty: medium
  question: >
    How does the narrator explain to Nastenka what a dreamer is, and how does she react to the word?
  answer: >
    The narrator tells Nastenka that a dreamer is not really a human being but a creature of an intermediate sort, who usually settles in some inaccessible corner as though hiding from the light of day. He grows attached to his corner like a snail or a tortoise, which is an animal and a house at once, and he is fond of his four walls, which are painted green, grimy and dismal and smell unpardonably of tobacco smoke. Nastenka replies that she knows what a dreamer is because she is one herself, and says that while sitting beside her grandmother she sometimes imagines marrying a Chinese Prince.
  ground_truth: >
