  - Paragraph 8
  - Paragraph 9
  - Paragraph 13
  contexts:
  - Crime_and_Punishment_Critical_Analysis.pdf
  adversarial: false

- id: ts5_long_02
  test_set: 5
  answer_type: long
  difficulty: hard
  question: >
    Why does the author think society has not collapsed into anarchy despite the terrible circumstances faced by deviants, and what role does fear play in this explanation?
  answer: >
    The author raises the question of how anarchy and universal chaos have not yet risen if such terrible circumstances existed for everyone. The author suggests that by the end of all three stories, the society the characters were rebelling so hard against appears to have triumphed, perhaps only in the physical sense because the system has not yet infiltrated the minds of deviants. The author then proposes that this is feasible because many people remain in fear of punishment and choose to think the same thoughts without ever acting on them. Fear and the shedding of it is what lingers with the author after reading the book, which the author traces through Raskolnikov, who starts off fearless in order to commit the crime, is fearful after the crime, and becomes a fearful, apologetic citizen again by the end of the novel, returning to love, which strips him of his hatred of the world.
  ground_truth: >
    The author raises the question of how anarchy and universal chaos have not yet risen if such terrible circumstances existed for everyone. The author suggests that by the end of all three stories, the society the characters were rebelling so hard against appears to have triumphed, perhaps only in the physical sense because the system has not yet infiltrated the minds of deviants. The author then proposes that this is feasible because many people remain in fear of punishment and choose to think the same thoughts without ever acting on them. Fear and the shedding of it is what lingers with the author after reading the book, which the author traces through Raskolnikov, who starts off fearless in order to commit the crime, is fearful after the crime, and becomes a fearful, apologetic citizen again by the end of the novel, returning to love, which strips him of his hatred of the world.
