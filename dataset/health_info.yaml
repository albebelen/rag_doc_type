  question: Which things at home are the biggest hotbeds for germs, and should I be cleaning them?
  answer: Washing machines, phones, microwaves, keyboards, doorknobs, light switches, bed rails, remote controls and children's toys are all hotbeds for bacteria and germs. Yes, you should wash these objects occasionally, because it helps reduce the build up of bacteria and germs.
  ground_truth: Washing machines, phones, microwaves, keyboards, doorknobs, light switches, bed rails, remote controls and children's toys are hotbeds for bacteria and germs; washing them occasionally reduces the build up of bacteria and germs.
  article_refs:
  - 4. Wash any item you touch
  contexts:
  - Washing machines, phones, microwaves, keyboards, doorknobs, light switches, bed rails, remote controls, and children's toys are all hotbeds for bacteria and germs! So washing all these objects occasionally helps reduce the risk of bacteria and germ build up.
  adversarial: false
