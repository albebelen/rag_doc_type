  question: If I want to avoid getting sick, is it better to do intense workouts or moderate exercise?
  answer: Moderate exercise, in the long run, strengthens the immune system. Intense workouts leave the body in a weakened state that also weakens the immune system, making you more susceptible to getting sick for a 72-hour window afterwards.
  ground_truth: Moderate exercise strengthens the immune system in the long run, whereas intense workouts weaken it and leave the body more susceptible to getting sick for a 72-hour window.
  article_refs:
