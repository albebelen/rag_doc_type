  adversarial: false
- id: ts1_medium_04
  test_set: 1
  answer_type: medium
  difficulty: medium
  question: Does my gut have anything to do with my immune system, and what should I eat to support it?
  answer: Roughly 60% to 70% of the entire immune system is located in the gut, which contains a healthy mix of bacteria that prevent pathogens and infections from being absorbed. To promote healthy bacteria it suggests kombucha or kimchi, instead of sugary yogurts.
  ground_truth: About 60-70% of the immune system is in the gut, whose healthy bacteria prevent pathogens and infections from being absorbed; kombucha or kimchi (instead of sugary yogurts) are suggested as probiotic sources.
  article_refs:
