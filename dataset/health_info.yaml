- id: ts2_medium_07
  test_set: 2
  answer_type: medium
  difficulty: hard
  question: How can I avoid catching germs that spread through the air, like from coughs or stuffy rooms?
  answer: Tip 8 says droplets from sneezes and coughs carrying germs travel much farther than previously thought, so holding your breath for 10-15 seconds after a sneeze or cough can reduce your chances of getting sick. Tip 9 says air circulating in a closed space such as an office or home carries germs and bacteria, so you should occasionally take a few minutes to get fresh air, even if it's chilly outside.
  ground_truth: 'Tip 8: hold your breath for 10-15 seconds after a sneeze or cough because droplets travel farther than thought. Tip 9: get fresh air occasionally because air circulating in closed spaces carries germs and bacteria.'
  article_refs:
  - 8. Hold your breath
  - 9. Get fresh air
  contexts:
  - Studies show that the droplets from sneezes and coughs carrying germs travel much farther than previously thought. Holding your breath for even 10-15 seconds after a sneeze or cough can reduce your chances of getting sick.
  - Sometimes, sharing warm air inside an office or home can lead to getting sick. The air that's circulating in a closed space carries germs and bacteria that can infect you. So take a few minutes occasionally to get some fresh air, when if it's a little chilly outside.
  adversarial: false
- id: ts2_long_08
  test_set: 2
  answer_type: long
  difficulty: hard
  question: Can germs on the things I touch every day get into my body, and what can I do to stop that?
  answer: Tip 4 explains that many everyday objects (washing machines, phones, microwaves, keyboards, doorknobs, light switches, bed rails, remote controls, children's toys) are hotbeds for bacteria and germs, and recommends washing them occasionally to reduce build up. Tip 6 explains that, because we touch so many things during the day, biting your nails exposes your mouth, nose and eyes to bacteria and germs that could be harmful, and recommends washing your hands with soap often and avoiding nibbling. Together, they describe a route from contaminated objects to hands to the mouth, nose and eyes, and recommend cleaning both the objects and your hands.
  ground_truth: 'Germs build up on commonly touched objects (tip 4: wash them occasionally) and reach the mouth, nose and eyes via the hands when biting nails (tip 6: wash hands with soap often and avoid nibbling).'
  article_refs:
  - 4. Wash any item you touch
  - 6. Stop biting your nails
  contexts:
  - Washing machines, phones, microwaves, keyboards, doorknobs, light switches, bed rails, remote controls, and children's toys are all hotbeds for bacteria and germs! So washing all these objects occasionally helps reduce the risk of bacteria and germ build up.
  - Think about everything you touch in the course of the day. Biting your nails means exposing your mouth, nose and eyes to a variety of bacteria and germs that could be harmful to you. So wash your hands with soap often and avoid the nibbling.
  adversarial: false
