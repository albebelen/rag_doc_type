- id: ts8_long_01
  test_set: 8
  answer_type: long
  difficulty: hard
  question: >
    Grouping the 100 stars by the first letter of their spectral type, how many fall into each class, which class is the most common, and how many stars have no spectral type listed?
  answer: >
    Of the 100 stars, 53 have a spectral type starting with M, 25 start with K, 8 start with G, 2 start with A, 2 start with D and 1 starts with F. One further star, Barnard's Star, has the subdwarf type sdM4, which would bring the M group to 54 if it is counted as an M star, and 8 stars have no spectral type listed. The M class is by far the most common.
  ground_truth: >
    Of the 100 stars, 53 have a spectral type starting with M, 25 start with K, 8 start with G, 2 start with A, 2 start with D and 1 starts with F. One further star, Barnard's Star, has the subdwarf type sdM4, which would bring the M group to 54 if it is counted as an M star, and 8 stars have no spectral type listed. The M class is by far the most common.
  article_refs:
  - Sheet1 - column Spectral Type, rows 2 to 101
  contexts:
  - nearest_stars.xlsx
  adversarial: false

- id: ts8_long_02
  test_set: 8
  answer_type: long
  difficulty: hard
  question: >
    Which stars are the nearest and the farthest according to the Distance (pc) column, and which stars have the lowest and highest absolute magnitude, with their apparent magnitudes for comparison?
  answer: >
    The table is ordered from nearest to farthest by its Distance (pc) column. The nearest star is Proxima Centauri (HIP 70890), which has the smallest value in the column (12948), and the farthest is Ross 490 (HIP 65859), which has the largest (76266). By absolute magnitude, Sirius A has the lowest value (1.45), making it the intrinsically brightest star in the list, while Proxima Centauri has the highest (15.45), making it the intrinsically faintest, even though it is the nearest. Their apparent magnitudes show the same contrast, as Sirius A has a Vmag of -1.44 and Proxima Centauri has a Vmag of 11.01.
  ground_truth: >
