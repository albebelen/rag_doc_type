  question: How does Swan Lake relate to the Romantic ballet tradition described in the Ballet article, even though it is presented as an example of classical ballet?
  answer: 'The Ballet article lists Swan Lake among classical ballet productions, together with The Sleeping Beauty and The Nutcracker. Romantic ballet, by contrast, was an early-to-mid nineteenth-century movement whose plots often revolved around spirit women (sylphs, wilis, ghosts) who enslaved the hearts of mortal men, with Giselle often considered the most celebrated Romantic ballet. The Swan Lake article shows several links to that tradition: the swan maidens may be variations of the wilis and sylphs common in Romantic ballets; Siegfried resembles Albrecht from Giselle, as both are deceived into betraying their beloved; and Tchaikovsky most admired Adolphe Adam''s 1844 score for Giselle, whose leitmotif technique he used in Swan Lake. Swan Lake therefore inherits Romantic themes and devices while belonging to the later classical repertoire.'
  ground_truth: 'Swan Lake is classed as classical ballet (alongside The Sleeping Beauty and The Nutcracker) but draws on Romantic ballet: its swan maidens may be variations of the wilis and sylphs of Romantic ballets (spirit women who enslaved mortal men), Siegfried resembles Albrecht from Giselle (the most celebrated Romantic ballet), and Tchaikovsky admired Adam''s Giselle score and used its leitmotif technique.'
  article_refs:
  - Ballet - Classical ballet
  - Ballet - Romantic ballet
  - Swan Lake - Origins of the ballet
  - Swan Lake - Tchaikovsky's influences
  contexts:
  - 'Some examples of classical ballet productions are: Swan Lake, The Sleeping Beauty and The Nutcracker.'
  - The plots of many romantic ballets revolved around spirit women (sylphs, wilis, and ghosts) who enslaved the hearts and senses of mortal men. [...] Jules Perrot is also known for his choreography, especially that of Giselle, often considered to be the most widely celebrated romantic ballet.
  - Siegfried's character resembles Albrecht from Giselle, as both are deceived into betraying their beloved, and the ball to choose a bride appears in La fille du Danube. The swan maidens may be variations of the wilis and sylphs common in Romantic ballets.
  - 'Tchaikovsky most admired Adam''s 1844 score for Giselle, which used the Leitmotif technique: associating certain themes with certain characters or moods, a technique he would use in Swan Lake and, later, The Sleeping Beauty.'
  adversarial: false
