  question: Where, when and under whose choreography did Swan Lake premiere, and why was the premiere considered a failure?
  answer: 'Swan Lake premiered on 4 March (O.S. 20 February) 1877 at the Bolshoi Theatre in Moscow, performed by the Bolshoi Ballet with choreography by Julius Reisinger. It was poorly received: most critics judged the score far too complicated for ballet (too noisy, too ''Wagnerian'' and too symphonic) and found Reisinger''s choreography unimaginative and unmemorable.'
  ground_truth: The premiere took place on 4 March (O.S. 20 February) 1877 at the Bolshoi Theatre in Moscow, choreographed by Julius Reisinger. It was badly received because critics found the score too complicated, noisy, 'Wagnerian' and symphonic, and the choreography unimaginative and unmemorable.
  article_refs:
  - Swan Lake - Introduction
  - Swan Lake - Original production of 1877
  contexts:
  - The ballet was premiered by the Bolshoi Ballet on 4 March [O.S. 20 February] 1877 at the Bolshoi Theatre in Moscow. The choreographer of this original production was Julius Reisinger (Václav Reisinger).
  - The première was not well received. Though there were a few critics who recognised the virtues of the score, most considered it to be far too complicated for ballet. It was labelled "too noisy, too 'Wagnerian' and too symphonic." The critics also thought Reisinger's choreography was "unimaginative and altogether unmemorable."
  adversarial: false
