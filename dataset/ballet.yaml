  question: What was Agrippina Vaganova's career path after graduating from the Imperial Ballet School, and which books did she write to document her method?
  answer: After graduating from the Imperial Ballet School in Saint Petersburg in 1897, she danced with the Imperial Russian Ballet. She retired from dancing in 1916 to teach and in 1921 returned as a teacher at the school, by then renamed the Leningrad Choreographic School. She wrote Fundamentals of the Classical Dance (1934) and The Foundation For Dance, better known as Basic Principles of Russian Classical Dance (1948).
  ground_truth: Graduated in 1897 and danced with the Imperial Russian Ballet; retired from dancing in 1916; returned in 1921 as a teacher at the school, renamed the Leningrad Choreographic School. She authored Fundamentals of the Classical Dance (1934) and The Foundation For Dance / Basic Principles of Russian Classical Dance (1948).
  article_refs:
  - Vaganova method - History
  contexts:
  - Upon graduating from the Imperial Ballet School in Saint Petersburg in 1897, Agrippina Vaganova began dancing with the school's associated professional company, the Imperial Russian Ballet. She retired from dancing in 1916 to pursue a teaching career and in 1921 returned as a teacher at the school, which had been renamed the Leningrad Choreographic School.
  - In 1934, Vaganova wrote Fundamentals of the Classical Dance, which remains a standard textbook for the instruction of ballet technique. In 1948, Vaganova authored a book titled The Foundation For Dance (more commonly known as Basic Principles of Russian Classical Dance) that outlined her training method and ballet technique.
  adversarial: false
