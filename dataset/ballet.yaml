  question: How did the 1895 Petipa-Ivanov revival of Swan Lake change the 1877 libretto and structure, and who revised Tchaikovsky's score for it?
  answer: 'For the 1895 revival, Modest Tchaikovsky revised the libretto. Odette changed from a fairy swan-maiden into a cursed mortal woman, and the villain changed from Odette''s stepmother to the magician von Rothbart. The finale changed too: in the 1877 scenario the lovers simply drowned at the hand of the stepmother, whereas in 1895 Odette drowns herself, Siegfried chooses to die with her, and their spirits are reunited in an apotheosis. The ballet was also reduced from four acts to three, with act 2 becoming act 1, scene 2. Tchaikovsky''s score was revised by Riccardo Drigo, after approval from Modest Tchaikovsky, and there are major differences between Drigo''s and Tchaikovsky''s scores.'
  ground_truth: 'Modest Tchaikovsky changed the libretto: Odette became a cursed mortal woman instead of a fairy swan-maiden; the villain became the magician von Rothbart instead of the stepmother; the finale became Odette drowning herself with Siegfried choosing to die too, followed by an apotheosis, instead of the lovers drowning at the hand of the stepmother. The ballet went from four acts to three (act 2 became act 1, scene 2). Riccardo Drigo revised the score with Modest''s approval.'
  article_refs:
  - Swan Lake - Petipa-Ivanov-Drigo revival of 1895
  - Swan Lake - 1877 libretto synopsis
  contexts:
  - Riccardo Drigo revised the score, after receiving approval from Tchaikovsky's younger brother, Modest. There are major differences between Drigo's and Tchaikovsky's scores. Today, it is Drigo's revision, and not Tchaikovsky's original score of 1877, that most ballet companies use.
  - 'Modest Tchaikovsky was called upon to make changes to the ballet''s libretto, including the character of Odette changing from a fairy swan-maiden into a cursed mortal woman, the ballet''s villain changing from Odette''s stepmother to the magician von Rothbart, and the ballet''s finale: instead of the lovers simply drowning at the hand of Odette''s stepmother as in the original 1877 scenario, Odette dies by drowning herself, with Prince Siegfried choosing to die as well, rather than live without her, and soon the lovers'' spirits are reunited in an apotheosis. Aside from the revision of the libretto the ballet was changed from four acts to three—with act 2 becoming act 1, scene 2.'
  - Her stepmother still wants to kill her and stalks her in the form of an owl, but she has a crown which protects her from harm. [...] The lake rises from the storm and drowns them.
  adversarial: false
