  question: What health-related concerns about ballet training are raised in the Vaganova method article and in the Ballet article, and how do the two relate?
  answer: 'The Vaganova method article reports a criticism that the method overemphasizes perfection of physical conditioning, leading to training environments that promote anorexia and other unhealthy behavior. The Ballet article''s health effects section is consistent with this: eating disorders are thought to be common among ballet dancers, and a 2014 meta-analysis suggests dancers are at higher risk than the general population for several kinds of eating disorders. It also mentions other physical risks, such as stress fractures of the first rib in teenage girl dancers, posterior ankle impingement syndrome, and lower bone mineral density in the arms. Overall, the Vaganova criticism is a specific instance (a particular training system) of the broader health risks documented for ballet.'
  ground_truth: 'Vaganova method: criticized for overemphasizing perfection of physical conditioning, fostering training environments that promote anorexia and other unhealthy behavior. Ballet: eating disorders are thought to be common, with a 2014 meta-analysis indicating higher risk than the general population; also first-rib stress fractures in teenage girls, posterior ankle impingement syndrome and lower arm bone mineral density.'
  article_refs:
  - Vaganova method - Criticism
  - Ballet - Health effects
  contexts:
  - One criticism is that it overemphasizes perfection of physical conditioning, leading to training environments that promote anorexia and other unhealthy behavior.
  - Teenage girl ballet dancers are prone to stress fractures in the first rib. Posterior ankle impingement syndrome (PAIS) most commonly affects people who perform repetitive plantar flexion, such as ballet dancers. Eating disorders are thought to be common, and a 2014 meta-analysis suggests that studies do indicate that ballet dancers are at higher risk than the general population for several kinds of eating disorders. In addition, some researchers have noted that intensive training in ballet results in lower bone mineral density in the arms.
  adversarial: false
