  - who_ipc_global-report_executive-summary.pdf
  adversarial: false

- id: ts11_long_03
  test_set: 11
  answer_type: long
  difficulty: hard
  question: >
    How are the eight core components of IPC programmes, the minimum requirements and the five-step implementation cycle related to each other?
  answer: >
    After the outbreak of Ebola virus disease in West Africa, WHO published guidelines in 2016 that identified eight core components of effective IPC programmes, six of which are relevant for both the national and the health care facility level, while two (core component 7, workload, staffing and bed occupancy, and core component 8, built environment, materials and equipment) should be implemented at the facility level. In 2019 WHO identified the IPC minimum requirements, which were derived directly from the core components through a consensus-building process and represent the starting point for the journey towards strong and effective IPC programmes, so they should be in place in all countries and health care facilities to support progress towards full and sustained implementation of all core components. Whether the minimum or the full requirements are applied, implementation should follow a stepwise approach, for which WHO proposes a five-step cycle: preparing for action, baseline assessment, developing and executing an action plan, evaluating impact, and sustaining the programme over the long term. A multimodal improvement strategy is embedded within each step of this cycle of continuous improvement, and a multidisciplinary team supports it.
  ground_truth: >
    After the outbreak of Ebola virus disease in West Africa, WHO published guidelines in 2016 that identified eight core components of effective IPC programmes, six of which are relevant for both the national and the health care facility level, while two (core component 7, workload, staffing and bed occupancy, and core component 8, built environment, materials and equipment) should be implemented at the facility level. In 2019 WHO identified the IPC minimum requirements, which were derived directly from the core components through a consensus-building process and represent the starting point for the journey towards strong and effective IPC programmes, so they should be in place in all countries and health care facilities to support progress towards full and sustained implementation of all core components. Whether the minimum or the full requirements are applied, implementation should follow a stepwise approach, for which WHO proposes a five-step cycle: preparing for action, baseline assessment, developing and executing an action plan, evaluating impact, and sustaining the programme over the long term. A multimodal improvement strategy is embedded within each step of this cycle of continuous improvement, and a multidisciplinary team supports it.
  article_refs:
  - Solutions to improve IPC - page 12
  - Solutions to improve IPC - page 13
  contexts:
  - who_ipc_global-report_executive-summary.pdf
  adversarial: false

