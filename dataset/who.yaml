- id: ts11_medium_05
  test_set: 11
  answer_type: medium
  difficulty: medium
  question: >
    According to Fig. 15, what are the five main reasons for investing in IPC?
  answer: >
    According to Fig. 15, the five main reasons for investing in IPC are that it ensures quality of care and patient and health workers' safety, directly improves key health outcomes and saves lives, reduces health care costs and out-of-pocket expenses, consists of proven strategies supported by implementation aids, and is scalable and adaptable to the local context.
