- id: ts11_medium_01
  test_set: 11
  answer_type: medium
  difficulty: medium
  question: >
    How common are health care-associated infections among hospitalised patients in high-income versus low- and middle-income countries, and how do the figures change for intensive care patients?
  answer: >
    Out of every 100 patients in acute-care hospitals, seven patients in high-income countries and 15 patients in low- and middle-income countries will acquire at least one health care-associated infection during their hospital stay. Among patients in intensive care, up to 30% can be affected by health care-associated infections, with an incidence that is two to 20 times higher in low- and middle-income countries than in high-income countries, in particular among neonates.
  ground_truth: >
    Out of every 100 patients in acute-care hospitals, seven patients in high-income countries and 15 patients in low- and middle-income countries will acquire at least one health care-associated infection during their hospital stay. Among patients in intensive care, up to 30% can be affected by health care-associated infections, with an incidence that is two to 20 times higher in low- and middle-income countries than in high-income countries, in particular among neonates.
  article_refs:
  - The problem of unsafe care resulting from HAIs and AMR - page 2
  contexts:
  - who_ipc_global-report_executive-summary.pdf
  adversarial: false

- id: ts11_medium_02
  test_set: 11
  answer_type: medium
  difficulty: medium
  question: >
    What did the comparison of the WHO national IPC surveys of 2017-2018 and 2021-2022 in 62 countries show about national IPC programmes, trained IPC focal points, dedicated IPC budgets and in-service IPC curricula?
  answer: >
    The percentage of countries with a national IPC programme remained relatively stable, at 64.5% in 2017-2018 and 61.3% in 2021-2022. There were significant increases in the percentage of countries with at least a trained IPC focal point (from 21% to 72.6%), in those with a dedicated IPC budget (from 25.8% to 48.4%) and in those with an in-service IPC curriculum (from 58.1% to 85.5%). However, in 2021-2022 only 41.5% of the countries reported that the national IPC programme was able to provide support for these training activities.
  ground_truth: >
    The percentage of countries with a national IPC programme remained relatively stable, at 64.5% in 2017-2018 and 61.3% in 2021-2022. There were significant increases in the percentage of countries with at least a trained IPC focal point (from 21% to 72.6%), in those with a dedicated IPC budget (from 25.8% to 48.4%) and in those with an in-service IPC curriculum (from 58.1% to 85.5%). However, in 2021-2022 only 41.5% of the countries reported that the national IPC programme was able to provide support for these training activities.
