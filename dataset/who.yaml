- id: ts11_medium_03
  test_set: 11
  answer_type: medium
  difficulty: medium
  question: >
    What are the five elements of the WHO multimodal improvement strategy for IPC, and what does the summary say about targeting only one element?
  answer: >
    The five elements are system change, training and education, monitoring and feedback, reminders and communications, and safety climate or culture change. In other words, the strategy involves building the right system, teaching the right things, checking the right things, selling the right messages and ultimately living IPC throughout the entire health system. Targeting only one element, that is using a unimodal strategy, is more likely to result in improvements that are short-lived and not sustainable.
  ground_truth: >
    The five elements are system change, training and education, monitoring and feedback, reminders and communications, and safety climate or culture change. In other words, the strategy involves building the right system, teaching the right things, checking the right things, selling the right messages and ultimately living IPC throughout the entire health system. Targeting only one element, that is using a unimodal strategy, is more likely to result in improvements that are short-lived and not sustainable.
  article_refs:
  - Solutions to improve IPC - page 14
  contexts:
  - who_ipc_global-report_executive-summary.pdf
  adversarial: false

- id: ts11_long_01
  test_set: 11
  answer_type: long
  difficulty: hard
  question: >
    How does the summary show that a country's income level is related to the implementation of IPC at the national level, at the health care facility level and for hand hygiene?
  answer: >
    At the national level, the summary reports a significant positive association between World Bank income level and IPC implementation, with high-income countries more than eight times as likely as low-income countries, and five times as likely as upper-middle-income countries, to have a more advanced implementation status. At the facility level, low-income countries scored at a basic level on average while high-income countries had more developed IPC in place for all core components, no facility in any low-income country had all the IPC minimum requirements in place, and only 18.9% of tertiary specialized facilities in high-income countries had implemented all of them. For hand hygiene, compliance was 64.5% in high-income countries versus 9.1% in low-income countries, alcohol-based handrub was available in only 17% of facilities in low-income countries versus 75% in high-income countries, and the scores for all five elements of the WHO multimodal hand hygiene improvement strategy were directly proportional to country income level. The foreword concludes from this that IPC is also a problem of equity and access to quality health care.
  ground_truth: >
    At the national level, the summary reports a significant positive association between World Bank income level and IPC implementation, with high-income countries more than eight times as likely as low-income countries, and five times as likely as upper-middle-income countries, to have a more advanced implementation status. At the facility level, low-income countries scored at a basic level on average while high-income countries had more developed IPC in place for all core components, no facility in any low-income country had all the IPC minimum requirements in place, and only 18.9% of tertiary specialized facilities in high-income countries had implemented all of them. For hand hygiene, compliance was 64.5% in high-income countries versus 9.1% in low-income countries, alcohol-based handrub was available in only 17% of facilities in low-income countries versus 75% in high-income countries, and the scores for all five elements of the WHO multimodal hand hygiene improvement strategy were directly proportional to country income level. The foreword concludes from this that IPC is also a problem of equity and access to quality health care.
