- id: ts11_long_04
  test_set: 11
  answer_type: long
  difficulty: hard
  question: >
    Describe the three phases of the WHO framework for IPC in outbreak preparedness, readiness and response shown in Fig. 14, including the timing of each phase and its immediate, early and advanced actions.
  answer: >
    Fig. 14 shows a cycle of three phases with feedback and continuous improvement at its centre. Phase one, Preparedness, takes place 2 years to 6 months in advance of any defined threat, with the immediate action of developing a foundation for IPC in outbreaks, the early action of identifying key personnel and partners, and the advanced action of auditing and testing the system. Phase two, Readiness, takes place up to 6 months in advance of a defined threat, with the immediate action of adapting existing tools for IPC in outbreaks, the early action of preparing key personnel and partners, and the advanced action of auditing and testing the system. Phase three, Response, covers the emergency actions required in response to a defined threat, with the immediate action of activating existing tools for IPC based on the outbreak context, the early action of monitoring for resurgence of cases, and the advanced action of conducting intra-action and/or after-action reviews. The text explains that WHO developed this framework, which provides a stepwise approach to IPC outbreak management, together with a toolkit of helpful resources.
  ground_truth: >
    Fig. 14 shows a cycle of three phases with feedback and continuous improvement at its centre. Phase one, Preparedness, takes place 2 years to 6 months in advance of any defined threat, with the immediate action of developing a foundation for IPC in outbreaks, the early action of identifying key personnel and partners, and the advanced action of auditing and testing the system. Phase two, Readiness, takes place up to 6 months in advance of a defined threat, with the immediate action of adapting existing tools for IPC in outbreaks, the early action of preparing key personnel and partners, and the advanced action of auditing and testing the system. Phase three, Response, covers the emergency actions required in response to a defined threat, with the immediate action of activating existing tools for IPC based on the outbreak context, the early action of monitoring for resurgence of cases, and the advanced action of conducting intra-action and/or after-action reviews. The text explains that WHO developed this framework, which provides a stepwise approach to IPC outbreak management, together with a toolkit of helpful resources.
