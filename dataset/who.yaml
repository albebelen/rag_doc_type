- id: ts11_medium_04
  test_set: 11
  answer_type: medium
  difficulty: medium
  question: >
    According to Fig. 3, how did the share of countries at level E, the highest IPC programme level, and the share at level A, with no national IPC programme or operational plan, change between 2018 and 2021?
  answer: >
    According to Fig. 3, the share of countries at level E rose from 12% in 2018 and 2019 to 15% in 2020 and 16% in 2021. The share at level A, with no national IPC programme or operational plan, barely changed, at 9% in 2018, 9% in 2019, 7% in 2020 and 9% in 2021.
