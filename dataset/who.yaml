- id: ts11_long_02
  test_set: 11
  answer_type: long
  difficulty: hard
  question: >
    What evidence does the summary give for the impact and cost-effectiveness of IPC, and what limits does it note?
  answer: >
    The summary says that IPC interventions can reduce the rates of health care-associated infections, in particular catheter-associated bloodstream infections, catheter-associated urinary tract infections, surgical site infections and ventilator-associated pneumonia, by 35-70% irrespective of a country's income level, and that hand hygiene is the most effective single measure to reduce the transmission of pathogens. Appropriate hand hygiene was cost-saving in all populations tested, and improving it could save about US$ 16.5 in health care expenditure for every US dollar invested. Hand hygiene and environmental hygiene in health care facilities were found to be the most cost-saving interventions, more than halving the risk of dying from infections with AMR pathogens and decreasing the associated long-term complications and health burden by at least 40%. According to OECD, a package of improved hand hygiene, antibiotic stewardship programmes and enhanced environmental hygiene would reduce the health burden of AMR by 85% while saving 0.7 euros per capita per year, and an OECD and WHO modelling study found that appropriate PPE combined with rapid IPC training could have averted SARS-CoV-2 infections and related deaths among health care workers during the first six months of the COVID-19 pandemic, with substantial net savings. The summary also notes that more research is needed, especially in low- and middle-income countries, because only a limited number of cost-effectiveness studies exist and most of them were carried out in high-income countries.
  ground_truth: >
    The summary says that IPC interventions can reduce the rates of health care-associated infections, in particular catheter-associated bloodstream infections, catheter-associated urinary tract infections, surgical site infections and ventilator-associated pneumonia, by 35-70% irrespective of a country's income level, and that hand hygiene is the most effective single measure to reduce the transmission of pathogens. Appropriate hand hygiene was cost-saving in all populations tested, and improving it could save about US$ 16.5 in health care expenditure for every US dollar invested. Hand hygiene and environmental hygiene in health care facilities were found to be the most cost-saving interventions, more than halving the risk of dying from infections with AMR pathogens and decreasing the associated long-term complications and health burden by at least 40%. According to OECD, a package of improved hand hygiene, antibiotic stewardship programmes and enhanced environmental hygiene would reduce the health burden of AMR by 85% while saving 0.7 euros per capita per year, and an OECD and WHO modelling study found that appropriate PPE combined with rapid IPC training could have averted SARS-CoV-2 infections and related deaths among health care workers during the first six months of the COVID-19 pandemic, with substantial net savings. The summary also notes that more research is needed, especially in low- and middle-income countries, because only a limited number of cost-effectiveness studies exist and most of them were carried out in high-income countries.
  article_refs:
  - Foreword - page iv
  - The impact and economic side of IPC - page 11
  - The impact and economic side of IPC - page 12
