- id: ts6_long_02
  test_set: 6
  answer_type: long
  difficulty: hard
  question: >
    How does the narrator describe himself and his loneliness to the girl, and what does he reveal about his experience with women and his dreams?
  answer: >
    The narrator tells the girl that he is shy and agitated with women, and that his arm trembles because it has never been held by a pretty little hand. He says he is a complete stranger to women and has never been used to them, having met only two or three women, who were all landladies. At twenty-six he says he has never seen anyone and has no acquaintance of any sort, and that he does nothing but dream every day that he will meet someone. He has often been in love in that way with no one, with an ideal he dreams of, making up regular romances in his dreams. He has even thought of speaking timidly to an aristocratic lady in the street, telling her that he is perishing in solitude and asking only for two or three sisterly words of sympathy. Finally, he calls himself a dreamer with so little real life that he values such moments as rare and goes over them again in his dreams, and he promises to dream of the girl all night, a whole week and a whole year.
  ground_truth: >
