- id: ts6_long_01
  test_set: 6
  answer_type: long
  difficulty: hard
  question: >
    How does the narrator's mood change over the course of the day, from his despondency in the city to the evening when he heads home?
  answer: >
    The narrator begins the day oppressed by a strange despondency, feeling lonely and as though everyone is forsaking him because all Petersburg has gone to its summer villas, and for three days he wanders the town in profound dejection. He eventually realizes that this exodus is the cause of his uneasiness, and he feels ashamed, mortified and sad that no one has invited him anywhere. His mood lifts when, after long walks, he finds himself at the city gates and passes into the fields and meadows, where he feels lighthearted and as though a burden is falling off his soul, the passers-by seem friendly, and he feels pleased as never before, as though he were in Italy. He sums this up by saying that his night was better than his day: he returns to the town very late, after ten, and walks along the deserted canal embankment singing, like a happy man who has no friend with whom to share his joy, just before he has a most unexpected adventure.
  ground_truth: >
    The narrator begins the day oppressed by a strange despondency, feeling lonely and as though everyone is forsaking him because all Petersburg has gone to its summer villas, and for three days he wanders the town in profound dejection. He eventually realizes that this exodus is the cause of his uneasiness, and he feels ashamed, mortified and sad that no one has invited him anywhere. His mood lifts when, after long walks, he finds himself at the city gates and passes into the fields and meadows, where he feels lighthearted and as though a burden is falling off his soul, the passers-by seem friendly, and he feels pleased as never before, as though he were in Italy. He sums this up by saying that his night was better than his day: he returns to the town very late, after ten, and walks along the deserted canal embankment singing, like a happy man who has no friend with whom to share his joy, just before he has a most unexpected adventure.
