- id: ts6_medium_03
  test_set: 6
  answer_type: medium
  difficulty: medium
  question: >
    How does the narrator drive off the staggering gentleman who chases the girl, and how does the gentleman react?
  answer: >
    When the staggering gentleman overtakes the girl and she shrieks, the narrator crosses the street in a flash with the knotted stick he happens to be holding in his right hand. The gentleman understands the irresistible argument and falls back without a word, and only protests in rather vigorous language once the narrator and the girl are very far away, so that his words hardly reach them.
