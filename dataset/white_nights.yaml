- id: ts6_long_03
  test_set: 6
  answer_type: long
  difficulty: hard
  question: >
    What arrangement do the narrator and the girl make for meeting again, what conditions does the girl set, and how does the night end?
  answer: >
    The girl says that she will perhaps come to the same place the next day at ten o'clock, but that the narrator must not imagine she is making an appointment with him, because she has to be there on her own account. She sets a compact as a condition: he must not fall in love with her, since she offers only friendship and asks him to be good and to do what she asks. She explains that she too has no one to whom she can say a word or ask advice, which is why she trusts him, and she hints that she may confide a secret to him the next day, though perhaps not, and that they will get to know each other better beforehand. The narrator promises to tell her everything about himself the next day, and the girl agrees that he should begin. They part with a repeated good-bye until tomorrow, and the narrator, too happy to go home, walks about all night.
