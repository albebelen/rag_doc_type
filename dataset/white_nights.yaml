- id: ts6_medium_02
  test_set: 6
  answer_type: medium
  difficulty: medium
  question: >
    How does the narrator relate to the houses of Petersburg, and what happened to the little pink house he was fond of?
  answer: >
    The narrator treats the houses of Petersburg as acquaintances and friends, imagining them greeting him from their windows and telling him their news, such as a new storey or a redecoration. His favourite was a charming little light pink brick house, until he heard it plaintively say that it was being painted yellow. It was painted yellow down to its columns and cornices, as yellow as a canary, and the narrator has not had the courage to visit his disfigured friend since.
  ground_truth: >
